# SonarQube / SonarCloud Configuration for Saukur Task
sonar.projectKey=saukurtask
sonar.projectName=Saukur Task
sonar.projectVersion=1.0

# Source code and test locations
sonar.sources=app,config,public,views
sonar.tests=tests

# Exclusions
sonar.exclusions=vendor/**,public/assets/**,docs/**,database/**
sonar.test.inclusions=tests/**/*Test.php

# PHPUnit test execution report
sonar.php.tests.reportPath=tests/phpunit-report.xml

# Character Encoding
sonar.sourceEncoding=UTF-8

# PHP Configuration
sonar.php.exclusions=vendor/**
